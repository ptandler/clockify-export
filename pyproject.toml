[project]
name = "clockify-export"
version = "0.1.4"
description = "Export Clockify time entries to CSV with incremental support"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Peter Tandler" }]
keywords = ["clockify", "export", "csv", "time-tracking", "incremental"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
]

[project.urls]
Homepage = "https://github.com/ptandler/clockify-export"
Repository = "https://github.com/ptandler/clockify-export"
"Bug Tracker" = "https://github.com/ptandler/clockify-export/issues"

[project.scripts]
clockify-export = "clockify_export.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clockify_export"]

[tool.uv]
package = true
