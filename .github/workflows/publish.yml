name: publish

# Publish to PyPI with Trusted Publishing (OIDC) — no API token needed.
# Triggered by pushing a version tag like v0.1.0.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for PyPI trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: uv build
      - name: Publish to PyPI
        run: uv publish